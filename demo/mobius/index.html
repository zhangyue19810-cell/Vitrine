<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Vitrine · 莫比乌斯档案环</title>
  </head>
  <body>
    <main id="app">
      <div id="scene" aria-label="莫比乌斯档案环三维预览"></div>
      <header class="hud top">
        <div class="brand">
          <span class="kicker">VITRINE · THREE.JS FIELD</span>
          <h1>莫比乌斯档案环</h1>
        </div>
        <div class="badge">MÖBIUS / 20 ARCHIVES</div>
      </header>
      <div class="hud controls">
        <span class="chip">拖动环视</span>
        <span class="chip">滚轮绕环切换</span>
        <span class="chip">单击聚焦</span>
        <span class="chip">双击模拟下载</span>
      </div>
      <div class="hud bottom">
        <span data-count>20 个内容档案</span>
        <span class="hint">悬停档案查看信息 · 下载进度直接绘制在档案表面</span>
        <span class="recipe">3dviz-pro-max · recipe.mobius-orientation-trace</span>
      </div>
      <div class="tip" data-tip hidden></div>
      <div class="status" data-status hidden></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
